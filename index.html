<!DOCTYPE html>
<!--
  게임명: 한 브랜드의 일생
  버전: v5.2 (2026-11-25)
  변경 요약 (v5.2):
   - PC 레이아웃: 화면 폭 1000px 이상에서 3단 구성 (왼쪽 브랜드 현황·매출 추이 / 가운데 사건 / 오른쪽 SNS 피드). 모바일은 그대로
  변경 요약 (v5.1):
   - 분기 리포트(3개월마다)와 연간 리포트(12·24개월): 월 매출·예산 추이 그래프 + 자동 인사이트
   - 결과 화면에 36개월 매출·예산 그래프와 3년 인사이트
  변경 요약 (v5):
   - 결말 분포를 성공 30% · 그저 그럼 40% · 망함 30%에 맞춤 (여러 플레이 스타일 혼합 기준)
   - 이직: 제안을 수락하면 새 회사 · 새 브랜드 · 새 대표로 전환되어 이어서 플레이
   - 브랜드 아이덴티티: 대표 컬러(고르면 화면 색이 바뀜) · 로고 서체 · 말투 · 슬로건
   - 광고 지표 판독: 광고비·노출·클릭률·전환율·객단가·ROAS를 보고 무엇을 고칠지 결정
   - 크리에이터: 나노 / 마이크로 / 메가 → 분야(딱 맞는 / 일상 / 밈 / 전혀 다른)
   - 감의 50:50: 행운 카드를 뽑지 않은 날, 감을 믿을지 묻는 반반 도박 + 두근 연출
   - 브랜드명: 실제 브랜드를 살짝 비튼 패러디 이름(기본) / 오리지널 이름 선택
  변경 요약 (v4):
   - 사적인 이야기 18개: 회식, 갑작스러운 광고주 약속, 소개팅·연애, 몸살, 축의금, 월세, 휴가, 헤드헌터 …
   - 아침의 '행운 뽑기': 매달 뽑으면 그달 도전 성공률이 바뀐다. 습관이 되면 깜빡한 날 이벤트가 생긴다
   - 업무 영역: 기획 · 영업 · 광고 · 일상으로 나누고, 영업의 '거래처' 지표 추가 (매출에 반영)
   - 대박의 순간 6개 (전국 체인 계약, 광고제 수상, 예능 협찬, 새벽 2시 품절, 크라우드펀딩 1,240%, 첫 수출)
   - 업무 순서를 '정답 없는 우선순위'로: 먼저 챙긴 일은 얻고, 가장 미룬 일은 대가를 치른다 (채점 없음)
   - 상승세(연속 매출 상승)와 마일스톤 배너 (월 매출 1억 돌파, 거래처 10곳 …), 최상위 엔딩 '모두가 아는 이름'
  변경 요약 (v3):
   - 돈을 실제 금액으로: 월 매출·마케팅 예산(만원), 내 연봉, 성과급·외주·자기계발비, 3년간 번 돈
   - 연봉 협상(12·24개월)과 승진(사원 → 주임 → 대리), 새 능력치 '업무력'
   - 연차별 '업무 순서 정하기' 9개: 순서에 따라 상사 신임·업무력이 오르내리고 정석 순서와 이유를 보여 준다
   - 업종별 전용 이벤트 24개 (8개 업종 × 3)
  변경 요약 (v2):
   - 선택지를 '정답 없는 딜레마'로 재설계: 모든 선택이 무언가를 얻고 무언가를 잃는다
   - 브랜드 SNS 피드: 선택이 게시물이 되고, 좋아요·댓글이 달리고, 팔로워가 움직인다 (프로필·그리드·3년의 피드)
   - 다시 나오는 인물 3명: 대표 · 동료 · 첫 고객(단골). 관계가 변하고 엔딩의 '남은 말'이 달라진다
   - 대표와의 관계가 0이 되면 '마케터가 바뀐 브랜드' 엔딩 (엔딩 9종)
   - 과거 선택이 돌아올 때 "N개월 전, 당신은 …" 연출
   - 장 이름: 시작 · 성장 · 위기 · 마무리
  수치·브랜드·인물은 모두 가상(창작 세계관)이며 실존 브랜드와 무관합니다.
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한 브랜드의 일생</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Jua&family=Nanum+Myeongjo:wght@700&display=swap" rel="stylesheet">
<meta name="description" content="오늘도 어딘가에서 브랜드 하나가 태어났습니다. 당신은 그 브랜드의 첫 마케터입니다.">
<style>
/* VOICE: 차분하고 사려 깊게, 가끔 웃프게 / IDEA: 한 브랜드의 SNS 계정과 마케터의 일기
   PICTURE: 브랜드의 피드(카드뉴스 타일) / COLOUR: 종이색 바탕 + 브랜드마다 다른 색 / LAYOUT: 모바일 한 열 */
:root{
  --bg:#f5f3ee; --card:#fffdf9; --ink:#1f1f1c; --sub:#6b6860; --line:#e3dfd5;
  --accent:#3f5b4f; --accent-ink:#fff; --soft:#ebe7dd; --up:#2f6b4a; --down:#9a3b2e; --heart:#c0392b;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#151513; --card:#1e1e1b; --ink:#ecebe6; --sub:#a29f96; --line:#33322e;
    --accent:#a9c7b8; --accent-ink:#151513; --soft:#2a2926; --up:#8fd0a8; --down:#f0a093; --heart:#f08a7e; }
}
:root[data-theme=light]{--bg:#f5f3ee;--card:#fffdf9;--ink:#1f1f1c;--sub:#6b6860;--line:#e3dfd5;--accent:#3f5b4f;--accent-ink:#fff;--soft:#ebe7dd;--up:#2f6b4a;--down:#9a3b2e;--heart:#c0392b}
:root[data-theme=dark]{--bg:#151513;--card:#1e1e1b;--ink:#ecebe6;--sub:#a29f96;--line:#33322e;--accent:#a9c7b8;--accent-ink:#151513;--soft:#2a2926;--up:#8fd0a8;--down:#f0a093;--heart:#f08a7e}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:-apple-system,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;
  font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-x:clip}
#app{max-width:440px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:16px 16px 40px;display:flex;flex-direction:column}
.fade{animation:fade .4s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h1{font-size:28px;line-height:1.35;margin:0 0 12px;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
h2{font-size:21px;line-height:1.4;margin:0 0 10px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
p{margin:0 0 10px}
.sub{color:var(--sub)} .small{font-size:13px} .center{text-align:center} .grow{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.stack>*+*{margin-top:10px}
.btn{display:block;width:100%;min-height:52px;padding:13px 16px;border-radius:14px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);font:inherit;font-size:16px;text-align:left;cursor:pointer;transition:transform .08s,background .2s}
.btn:active{transform:scale(.985)} .btn:hover{background:var(--soft)}
.btn:focus-visible,.link:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible,.tile:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn .k{display:inline-block;min-width:22px;color:var(--sub);font-size:13px;margin-right:6px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);text-align:center;font-weight:700}
.btn.ghost{background:transparent;text-align:center}
.btn.mini{min-height:36px;padding:6px 12px;font-size:13px;width:auto;display:inline-block;border-radius:999px;text-align:center}
.btn[disabled]{opacity:.5;pointer-events:none}
.row{display:flex;gap:8px} .row>.btn{flex:1}
.hero{padding:40px 0 22px}
.hero .eyebrow{font-size:13px;color:var(--sub);margin-bottom:14px}
details{border-top:1px solid var(--line);padding-top:10px;margin-top:14px}
summary{cursor:pointer;color:var(--sub);font-size:14px;min-height:32px}
label.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;font-size:14px}
select,input[type=text],textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
textarea{width:100%;min-height:84px;resize:vertical}

/* 프로필 바 */
.pbar{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.av{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:16px}
.av.sm{width:30px;height:30px;font-size:13px}
.av.ring{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--brand)}
.pbar .nm{font-weight:700;font-size:15px;line-height:1.2}
.pbar .fl{font-size:13px;color:var(--sub)}
.pbar .fl b{color:var(--ink);font-variant-numeric:tabular-nums}
.pbar .sp{flex:1}
.hud{position:sticky;top:0;background:var(--bg);padding:6px 0 8px;z-index:2}
.progress{height:3px;background:var(--soft);border-radius:3px;margin:2px 0 8px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--sub);transition:width .4s}
.meters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px 10px}
.meters+.meters{margin-top:4px}
.meter.sal .v{display:block;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:1px;white-space:nowrap}
.money{font-size:12px;color:var(--sub);margin-top:5px;display:flex;flex-wrap:wrap;gap:2px 10px}
.money b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.step{display:flex;align-items:center}
.step .k{display:inline-grid;place-items:center;min-width:26px;height:26px;border-radius:50%;border:1px solid var(--line);margin-right:10px;font-weight:700}
.step.on{background:var(--soft);border-color:var(--accent)}
.step.on .k{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.post .img .hd,.tile,.pbar .nm,.brandname{font-family:var(--brandfont,inherit)}
body{transition:background-color .6s}
.chart{margin:8px 0 4px}
.chart h3{font-size:14px;margin:0 0 2px;font-weight:700}
.chart .cap{font-size:12px;color:var(--sub);margin:0 0 4px}
.chart svg{display:block;width:100%;max-width:460px;height:auto;overflow:visible}
.chart .ax{font-size:10px;fill:var(--sub)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--accent);opacity:.08}
.chart .pt{fill:var(--accent);stroke:var(--card);stroke-width:2}
.chart .hit{fill:transparent;cursor:pointer}
.chart .hl{fill:var(--soft)}
.chart .sw{stroke:var(--sub);stroke-dasharray:3 3}
.chart .lbl{font-size:11px;font-weight:700;fill:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0}
.tile2{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:12px;color:var(--sub)}
.tile2 b{display:block;font-size:19px;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.3}
.tile2 .d{font-size:12px;font-weight:700}
.tile2 .d.up{color:var(--up)} .tile2 .d.down{color:var(--down)}
.insight{list-style:none;padding:0;margin:6px 0 0}
.insight li{position:relative;padding:8px 0 8px 18px;border-top:1px solid var(--line);font-size:14px}
.insight li:first-child{border-top:0}
.insight li::before{content:"";position:absolute;left:2px;top:15px;width:7px;height:7px;border-radius:2px;background:var(--accent)}
table.data{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
table.data th,table.data td{padding:4px 2px;border-bottom:1px solid var(--line);text-align:right}
table.data th:first-child,table.data td:first-child{text-align:left}
.mx{width:100%;border-collapse:collapse;font-size:14px;margin:4px 0 14px;font-variant-numeric:tabular-nums}
.mx td{padding:6px 0;border-bottom:1px solid var(--line)}
.mx td:last-child{text-align:right;font-weight:700;white-space:nowrap}
.mx tr.hl td:last-child{color:var(--accent)}
.suspense{min-height:60vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.suspense .big{font-size:44px;font-weight:800;letter-spacing:.06em;animation:beat .55s ease-in-out infinite alternate}
@keyframes beat{from{transform:scale(1)}to{transform:scale(1.12)}}
.verdict{display:inline-block;font-weight:800;font-size:15px;padding:4px 12px;border-radius:999px;margin-bottom:8px}
.verdict.win{background:var(--accent);color:var(--accent-ink)} .verdict.lose{background:var(--soft);color:var(--down)}
.idcard{display:flex;gap:14px;align-items:center}
.swatch{flex:none;width:64px;height:64px;border-radius:16px;border:1px solid var(--line)}
.idcard .bn{font-size:26px;line-height:1.2}
.banner{margin:12px 0 4px;padding:16px;border-radius:16px;background:var(--accent);color:var(--accent-ink);text-align:center;animation:pop .6s cubic-bezier(.2,1.4,.4,1) both}
.banner small{display:block;font-size:12px;opacity:.85}
.banner b{display:block;font-size:22px;letter-spacing:-.02em;line-height:1.3}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
.fortune{margin-top:14px;border:1px dashed var(--line);border-radius:16px;padding:14px;text-align:center}
.fortune .tier{font-size:30px;font-weight:800;letter-spacing:.04em;line-height:1.2}
.fortune .tier.t0{color:var(--up)} .fortune .tier.t3{color:var(--down)}
.trk{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--ink);margin-right:6px;vertical-align:1px}
.trk.t-plan{background:#e3ecf7;color:#234a7a} .trk.t-sales{background:#f6eadb;color:#7a4b14} .trk.t-ad{background:#f3e1ea;color:#7a2350} .trk.t-life{background:#e5f0e6;color:#2e5d36}
@media (prefers-color-scheme: dark){ .trk.t-plan{background:#22324a;color:#bcd3f0} .trk.t-sales{background:#3d2f1d;color:#f0d3ae} .trk.t-ad{background:#3d2030;color:#f0bcd6} .trk.t-life{background:#203325;color:#bfe0c5} }
.tl li.jp::before{background:#d4a017;border-color:#d4a017}
.orderres{list-style:none;padding:0;margin:8px 0 0;font-size:14px}
.orderres li{display:flex;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.orderres li:first-child{border-top:0}
.orderres .n{flex:none;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:12px;font-weight:700}
.orderres .mk{margin-left:auto;flex:none;font-size:12px;color:var(--sub)}
.why{font-size:14px;background:var(--soft);border-radius:12px;padding:12px;margin-top:10px}
.career{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:8px}
.career div{font-size:12px;color:var(--sub)}
.career b{display:block;font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums}
.meter{font-size:12px;position:relative}
.meter .lab{display:flex;justify-content:space-between;gap:4px}
.meter .lab span:last-child{font-variant-numeric:tabular-nums}
.meter .lab{white-space:nowrap}
.meter .bar{height:4px;background:var(--soft);border-radius:4px;overflow:hidden;margin-top:1px}
.meter .bar i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .5s}
.meter.low .lab span:first-child::after{content:" 위험";color:var(--down);font-weight:700}
.people{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--sub);margin-top:6px}
.people b{color:var(--ink);font-weight:600}
.float{position:absolute;right:0;top:-13px;font-size:12px;font-weight:700;animation:flo 1.4s ease forwards;pointer-events:none}
.float.up{color:var(--up)} .float.down{color:var(--down)}
@keyframes flo{0%{opacity:0;transform:translateY(6px)}20%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}

.monthtag{font-size:13px;color:var(--sub);margin:10px 0 8px}
.who{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:14px}
.who .role{color:var(--sub);font-size:12px}
.evtext{font-size:18px;line-height:1.7;margin-bottom:16px}
.callback{font-size:14px;background:var(--soft);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.callback b{font-weight:600}
.deltas{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.chip{font-size:13px;padding:3px 9px;border-radius:999px;background:var(--soft)}
.chip.up{color:var(--up)} .chip.down{color:var(--down)}

/* 게시물 */
.post{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-top:14px}
.post .ph{display:flex;align-items:center;gap:8px;padding:10px 12px;font-size:13px}
.post .ph b{font-size:14px}
.post .ph .kind{margin-left:auto;color:var(--sub);font-size:12px}
.post .img{aspect-ratio:1/1;display:flex;align-items:flex-end;padding:22px;color:#fff;position:relative;overflow:hidden}
.post .img::before{content:"";position:absolute;width:70%;aspect-ratio:1;border-radius:50%;right:-18%;top:-18%;background:rgba(255,255,255,.14)}
.post .img::after{content:"";position:absolute;width:38%;aspect-ratio:1;border-radius:50%;left:-10%;bottom:28%;background:rgba(0,0,0,.08)}
.post .img .hd{position:relative;z-index:1;font-size:24px;font-weight:800;line-height:1.3;letter-spacing:-.02em;text-wrap:balance}
.post .img .tg{position:absolute;z-index:1;top:16px;left:18px;font-size:12px;font-weight:700;letter-spacing:.02em;background:rgba(255,255,255,.22);padding:3px 9px;border-radius:999px}
.post .pb{padding:10px 12px 12px;font-size:14px}
.post .likes{font-weight:700;font-variant-numeric:tabular-nums}
.post .likes::before{content:"♥ ";color:var(--heart)}
.post .cap{margin:2px 0 6px}
.post .cm{font-size:13px;margin:2px 0}
.post .cm b{font-weight:600;margin-right:4px}
.post .cm.fan b{color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;margin-top:10px}

.tl .m{color:var(--sub);font-size:12px;display:block}

.texture{border-left:3px solid var(--accent);padding-left:12px}
.voice{display:flex;gap:10px;align-items:flex-start;font-size:15px}

/* =========================================================================

function mulberry32(a) {

  }
}
function fill(s, str) {

    rev: fmtMan(revOf(s)), bud: fmtMan(budOf(s)), sal: s.money ? fmtMan(s.money.salary) : "",
    c3: IND_COLOR[s.brand.industry].name, crn: fmtMan(budOf(s, 4)), crm: fmtMan(budOf(s, 9)), crg: fmtMan(budOf(s, 18)),
    cfit: CREATOR_CATS[s.brand.industry][0], cnear: CREATOR_CATS[s.brand.industry][1], cmeme: CREATOR_CATS[s.brand.industry][2], cfar: CREATOR_CATS[s.brand.industry][3] };
  return str.replace(/\{(b|p|f|ceo|col|fan|rev|bud|sal|c3|crn|crm|crg|cfit|cnear|cmeme|cfar)\}(\{(는|은|가|이|를|을|와|과|로)\})?/g, (_, k, __, j) => {

const EV_BY_ID = Object.fromEntries(EVENTS.map(e => [e.id, e]));

const Engine = {
  newSeed() { return (Math.floor(Math.random() * 2 ** 31) ^ Date.now()) >>> 0; },

  makeBrand(seed, opts = {}) {
    const rng = mulberry32(seed);
    const ind = INDUSTRIES.find(i => i.id === opts.industry) || pickOne(rng, INDUSTRIES);
    const size = pickOne(rng, SIZES);
    const comp = pickOne(rng, COMPS);

    const hue = Math.floor(rng() * 360);

  },

  newGame(seed, opts = {}) {
    const { brand, npc } = this.makeBrand(seed, opts);

      seed, brand, npc, month: 0,
      rng: mulberry32(seed ^ 0x9E3779B9),
      stats: { aware: 8, trust: 30, sales: 15, budget: size.budget, rel: size.rel, skill: 20, energy: size.energy },
      money: { salary: size.salary, start: size.salary, earned: 0, cash: 0, hist: [] }, title: 0,
      hist: [], identity: {}, brandStart: 0, crTier: null, chain: null, offer: null, mx: null, prevBrands: [], parody: opts.parody !== false,
      acc: size.acc, momentum: 0, bestMomentum: 0, fortune: null, drew: false, drawStreak: 0, drawCount: 0, ms: {}, newMs: [], accLost: 0,
      bond: { col: 45, fan: 25 },
      axes: { d: 0, p: 0, c: 0, e: 0 },
      flags: {}, seen: {}, recent: [], pending: [], force: [],

  },

  snapshot(s) {

      fol: followers(s), brand: s.brand.name, ev: evs.length ? evs[evs.length - 1].title : "", jp: evs.some(l => l.jackpot) });
  },

  advance(s) {

  /* 이번 달 사건을 고른다 (행운 뽑기 이후) */
  start(s) {

    if (!s.drew && s.month > 1) s.drawStreak = 0;     // 뽑기를 건너뛰면 습관이 끊긴다

      for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(s.rng() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }

  /* 광고 지표 만들기 (금액: 만원, 단가: 원) — 약점 하나를 숨겨 둔다 */
  mxGen(s) {
    const r = () => s.rng();
    const weak = ["ctr", "cvr", "aov", "scale"][Math.floor(r() * 4)];
    const spend = Math.max(30, Math.round(budOf(s) * 0.25 / 10) * 10);
    const cpc = Math.round(weak === "ctr" ? 1100 + r() * 400 : 450 + r() * 350);
    const clicks = Math.max(50, Math.round(spend * 10000 / cpc));
    const ctr = +(weak === "ctr" ? 0.4 + r() * 0.3 : 1.6 + r() * 1.0).toFixed(1);
    const imps = Math.round(clicks / (ctr / 100));
    const cvr = +(weak === "cvr" ? 0.5 + r() * 0.4 : 2.2 + r() * 1.3).toFixed(1);
    const conv = Math.max(1, Math.round(clicks * cvr / 100));
    let aov = +(weak === "aov" ? 1.2 + r() * 0.6 : weak === "scale" ? 4.2 + r() * 1.6 : 3.0 + r() * 1.4).toFixed(1);

  mxExplain(m) {

    if (pick === "scale") return { budget: -6, sales: 1, rel: -2, text: "예산을 늘렸지만 새는 곳도 같이 커졌다. " + ex };

  /* 크리에이터: 등급 × 분야 */
  creator(s, kind) {
    const t = CR_TIER[s.crTier] || CR_TIER.micro;
    const cats = CREATOR_CATS[s.brand.industry];

    const post = { k: "collab", h: `${name} 크리에이터 × {b}`, c: { nano: "열 명의 진짜 후기", micro: "세 사람의 이야기", mega: "그 사람이 {b}{를} 썼다" }[s.crTier] };
    if (kind === "fit") return { aware: t.aware, sales: Math.round(t.sales * 1.7), trust: t.trust + 2, fan: s.crTier === "nano" ? 4 : 0, post,

      : { aware: Math.round(t.aware * 0.4), trust: -2, post, _win: false, text: "웃기긴 했다. {b}{는} 아무도 기억하지 못했다." };

  /* 이직 */
  makeOffer(s) {
    const others = INDUSTRIES.filter(i => i.id !== s.brand.industry);
    const ind = others[Math.floor(s.rng() * others.length)];
    const seed = Math.floor(s.rng() * 2 ** 31);

  switchCompany(s) {

    const size = SIZES.find(x => x.id === o.brand.size);

    s.money.salary = o.salary;
    const base = { solo: 10, small: 18, big: 28 }[size.id];

    const f = {}; keep.forEach(k => { if (s.flags[k]) f[k] = true; });

  checkMilestones(s) {

    if (s.flags.core_fans) target += 3;

    if (st.aware >= 50 && s.rng() < 0.5) st.energy = clamp(st.energy - 1);   // 브랜드가 커질수록 일이 많아진다
    if (s.flags.col_left && s.rng() < 0.5) st.energy = clamp(st.energy - 1);   // 동료가 떠나면 일이 늘어난다
    if (s.flags.col_stays && s.bond.col >= 60 && s.rng() < 0.4) st.energy = clamp(st.energy + 1);
    if (s.month % 3 === 0) s.bond.fan = clamp(s.bond.fan - 1);        // 챙기지 않으면 단골도 멀어진다
  },

  pickEvent(s) {
    const m = s.month;
    const key = EVENTS.find(e => e.key === m);
    if (key) return key;
    if (s.force.length) return EV_BY_ID[s.force.shift()];
    s.pending.sort((a, b) => a.at - b.at);
    const dueIdx = s.pending.findIndex(p => p.at <= m);
    if (dueIdx >= 0) { const p = s.pending.splice(dueIdx, 1)[0]; s.curFrom = p.from; return EV_BY_ID[p.id]; }
    const ch = chapterOf(m);
    const yr = yearOf(m);
    const pool = EVENTS.filter(e => !e.key && !e.delayed && !e.chainOnly
      && ((e.stage && e.stage.includes(ch)) || (e.year && e.year.includes(yr)))
      && (!e.ind || e.ind === s.brand.industry)
      && !(e.once !== false && s.seen[e.id]) && (!e.cond || e.cond(s)));
    if (!pool.length) return EV_BY_ID.f_quiet;
    const hasRegular = pool.some(e => !e.fallback);
    const ws = pool.map(e => (typeof e.weight === "function" ? e.weight(s) : (e.weight || 10)) * (s.recent.includes(e.id) ? 0.2 : 1) * (e.fallback && hasRegular ? 0.5 : 1));
    let r = s.rng() * ws.reduce((a, b) => a + b, 0);
    for (let i = 0; i < pool.length; i++) { r -= ws[i]; if (r <= 0) return pool[i]; }
    return pool[pool.length - 1];
  },

  makePost(s, p, good) {
    const kind = POST_KINDS[p.k] || POST_KINDS.photo;
    const f = followers(s);
    const mood = (s.stats.trust - 45) / 40 + kind.tone * 0.25 + (good ? 0.35 : -0.35);
    const likes = Math.max(3, Math.round(f * kind.rate * (0.7 + s.rng() * 0.6) * (good ? 1.15 : 0.85)));
    const cmts = [];
    if (s.bond.fan >= 55 && kind.tone >= 0) cmts.push({ u: s.npc.fan, t: fill(s, pickOne(s.rng, FAN_LINES)), fan: true });
    while (cmts.length < 2) {
      const pos = s.rng() < Math.max(0.12, Math.min(0.9, 0.5 + mood * 0.4));
      const pool = s.rng() < 0.45 && COMMENTS[p.k] ? COMMENTS[p.k] : (pos ? COMMENTS.pos : COMMENTS.neg);
      const t = pickOne(s.rng, pool);
      if (!cmts.some(c => c.t === t)) cmts.push({ u: pickOne(s.rng, CROWD), t });
    }
    const post = { m: s.month, k: p.k, kind: kind.name, h: fill(s, p.h), c: fill(s, p.c), likes, cmts, id: s.posts.length };
    s.posts.push(post);
    return post;
  },

  applyEffect(s, eff, ctx = {}) {
    if (typeof eff === "function") eff = eff(s);
    eff = eff || {};
    const deltas = {};
    for (const k of STAT_KEYS) {
      if (eff[k]) { const b = s.stats[k]; s.stats[k] = clamp(b + eff[k]); const d = s.stats[k] - b; if (d) deltas[k] = d; }
    }
    for (const k of BOND_KEYS) {
      if (eff[k]) { const b = s.bond[k]; s.bond[k] = clamp(b + eff[k]); const d = s.bond[k] - b; if (d) deltas[k] = d; }
    }
    if (eff.salary) { s.money.salary += eff.salary; s.money.hist.push({ m: s.month, d: eff.salary }); deltas.salary = eff.salary; }
    if (eff.cash) { s.money.cash += eff.cash; deltas.cash = eff.cash; }
    if (eff.identity) {
      for (const k in eff.identity) {
        const v = k === "slogan" ? fill(s, eff.identity[k]) : eff.identity[k];
        s.identity[k] = v;
        if (k === "color") { s.brand.hue = hexHue(v.hex); deltas.identity = `대표 컬러 · ${v.name}`; }
        if (k === "font") deltas.identity = `서체 · ${FONT_NAME[v]}`;
        if (k === "voice") deltas.identity = `말투 · ${v}`;
        if (k === "slogan") deltas.identity = `슬로건 · ${v}`;
      }
    }
    if (eff.crTier) s.crTier = eff.crTier;
    if (eff.next) s.chain = eff.next;
    if (eff.switchJob) { const nm = s.offer.brand.name; this.switchCompany(s); deltas.switched = nm; }
    if (eff.acc) { const b = s.acc; s.acc = Math.max(0, s.acc + eff.acc); if (s.acc !== b) deltas.acc = s.acc - b; }
    if (eff.promo && s.title < TITLES.length - 1) { s.title += 1; deltas.promo = TITLES[s.title]; }
    if (eff.ax) for (const k in eff.ax) s.axes[k] = clamp(s.axes[k] + eff.ax[k], -12, 12);
    if (eff.flag) [].concat(eff.flag).forEach(f => { s.flags[f] = true; });
    if (eff.later) {
      const L = eff.later;
      const at = s.month + L.min + Math.floor(s.rng() * (L.max - L.min + 1));
      if (at <= CONFIG.MONTHS) s.pending.push({ id: L.id, at, from: { m: s.month, label: ctx.label || "" } });
    }
    const good = ((deltas.trust || 0) + (deltas.aware || 0)) >= 0 && ctx.success !== false;
    const post = eff.post ? this.makePost(s, eff.post, good) : null;
    return { deltas, text: eff.text || "", post, win: eff._win };
  },

  choose(s, idx) {
    const ev = s.cur;
    const ch = ev.choices[Math.max(0, Math.min(idx, ev.choices.length - 1))];
    const label = fill(s, ch.label);
    if (ch.ax) for (const k in ch.ax) s.axes[k] = clamp(s.axes[k] + ch.ax[k], -12, 12);
    let res, success = null;
    const fBefore = followers(s);
    if (ch.roll) {
      const p0 = typeof ch.roll.p === "function" ? ch.roll.p(s) : ch.roll.p;
      const p = Math.max(0.02, Math.min(0.97, p0 + (s.fortune ? s.fortune.bonus : 0)));
      success = s.rng() < p;
      res = this.applyEffect(s, success ? ch.roll.success : ch.roll.fail, { label, success });
    } else {
      res = this.applyEffect(s, ch.effect, { label });
      if (res.win === true || res.win === false) success = res.win;
    }
    s.log.push({ m: s.month, id: ev.id, title: fill(s, ev.title), tr: trackOf(ev), jackpot: !!(success && ch.roll && ch.roll.success && ch.roll.success.flag === "jackpot") || !!(ch.effect && ch.effect.flag === "jackpot"), label, idx, key: !!(ev.key || ev.delayed), result: fill(s, res.text), success, post: res.post ? res.post.id : null });
    s.followersLog.push(followers(s));
    this.checkMilestones(s);
    this.postCheck(s);
    return { text: fill(s, res.text), deltas: res.deltas, success, post: res.post, followerDelta: followers(s) - fBefore };
  },

  /* 조기 종료 · 경고 판정 */
  postCheck(s) {
    if (s.stats.budget <= 0) s.end = "closed";
    else if (s.stats.energy <= 0) {
      if (s.flags.burn_warned) s.end = "left";
      else { s.flags.burn_warned = true; s.force.push("x_burnout"); }
    }
    if (!s.end) {
      if (s.stats.rel <= 0 && s.flags.ceo_warned) s.end = "replaced";
      else if (s.stats.rel <= 12 && !s.flags.ceo_warned) { s.flags.ceo_warned = true; s.force.push("x_ceo_talk"); }
    }
    if (s.month >= CONFIG.MONTHS && !s.end) s.end = "natural";
  },

  evText(s, ev) { return fill(s, typeof ev.text === "function" ? ev.text(s) : ev.text); },

  /* 업무 순서: 정답은 없다. 가장 먼저 한 일은 온전히, 두 번째는 절반만 얻고, 가장 미룬 일은 대가를 치른다 */
  chooseOrder(s, seq) {
    const ev = s.cur, st = ev.steps, n = seq.length;
    const eff = { skill: 2, energy: -2 };
    const add = (o, k) => { for (const key in o) eff[key] = (eff[key] || 0) + Math.round(o[key] * k); };
    add(st[seq[0]].first, 1);
    add(st[seq[1]].first, 0.5);
    add(st[seq[n - 1]].last, 1);
    const fBefore = followers(s);
    const label = seq.map(i => fill(s, st[i].t)).join(" → ");
    const firstT = fill(s, st[seq[0]].t), lastT = fill(s, st[seq[n - 1]].t);
    const text = `${fill(s, st[seq[0]].ft)} 대신, ${fill(s, st[seq[n - 1]].lt)}`;
    const res = this.applyEffect(s, eff, { label });
    s.log.push({ m: s.month, id: ev.id, title: fill(s, ev.title), tr: "work", label, order: firstT, key: false, result: text, success: null, post: null });
    s.followersLog.push(followers(s));
    this.checkMilestones(s);
    this.postCheck(s);
    return { text, deltas: res.deltas, success: null, post: null, followerDelta: followers(s) - fBefore, seq,
      first: { t: firstT, txt: fill(s, st[seq[0]].ft) }, last: { t: lastT, txt: fill(s, st[seq[n - 1]].lt) } };
  },

  /* 연봉 협상 + 승진 */
  review(s, mode) {
    const st = s.stats; const r = s.rng();
    let raise = 0, rel = 0, energy = -2, budget = 0, text = "";
    if (mode === "data") {
      const p = Math.min(0.9, 0.25 + st.skill / 140 + (st.sales >= 50 ? 0.15 : 0)); energy = -5;
      if (r < p) { raise = 300 + (st.skill >= 60 ? 100 : 0); text = "준비한 숫자 한 장에 {ceo}{가} 고개를 끄덕였다."; }
      else { raise = 120; text = "\"숫자는 좋은데, 회사 사정이…\" 생각보다 적었다."; }
    } else if (mode === "understand") {
      raise = st.rel >= 60 ? 180 : 100; rel = 6; text = "\"이해해 줘서 고마워요.\" 고마움은 진심 같았다. 금액은 작았다.";
    } else if (mode === "budget") {
      raise = 80; rel = 4; budget = 12; text = "\"자기 연봉보다 브랜드를 먼저 챙기네요.\" 예산이 늘었다. 연봉은 조금만.";
    } else {
      const p = Math.min(0.85, 0.3 + st.rel / 250 + st.skill / 250);
      if (r < p) { raise = 500; rel = -4; text = "{ceo}{는} 잠시 말이 없더니 숫자를 고쳐 적었다."; }
      else { raise = 0; rel = -12; text = "\"그럼 그쪽으로 가셔도 돼요.\" 차가운 침묵이 흘렀다."; }
    }
    let promo = false;
    if (s.title < TITLES.length - 1 && st.skill >= PROMO_NEED[s.title]) {
      promo = true; raise += 200;
      const t = TITLES[s.title + 1]; text += ` 그리고 ${t}${josa(t, "로")} 승진했다.`;
    } else if (s.title < TITLES.length - 1) {
      text += ` 승진은 다음 기회로 미뤄졌다. (업무력 ${PROMO_NEED[s.title]} 필요)`;
    }
    return { salary: raise, rel, energy, budget, promo, text };
  },

  textureKey(s) {
    const a = s.axes;
    const pick = (v, bit, pos, neg) => v > 0 ? pos : v < 0 ? neg : ((s.seed >>> bit) & 1 ? pos : neg);
    return pick(a.d, 0, "D", "G") + pick(a.p, 1, "P", "F") + pick(a.c, 2, "C", "O") + pick(a.e, 3, "E", "S");
  },

  judge(s) {
    if (["closed", "left", "replaced"].includes(s.end)) return s.end;
    if (s.flags.reborn) return "reborn";
    const { aware: A, trust: T, sales: S, budget: B } = s.stats;
    if (S < BAL.closeS || B <= 0) return "closed";
    if (A >= 65 && T >= 60 && S >= 72 && (s.acc >= 8 || s.flags.jackpot)) return "legend";
    if (A >= BAL.belA && T >= 62 && S >= BAL.belS) return "beloved";
    if (T >= BAL.regT && S >= BAL.regS && A < BAL.belA) return "regulars";
    if (A >= 48 && T < 45) return S >= 48 ? "grew" : "flash";
    return "unfinished";
  },

  finalize(s) {
    this.snapshot(s);
    const id = this.judge(s);
    const tk = this.textureKey(s);
    const e = ENDINGS[id];
    const npcVoices = [
      { who: s.npc.fan, role: "첫 고객", key: "fan", text: VOICES_NPC.fan(s) },
      { who: s.npc.col, role: "동료", key: "col", text: VOICES_NPC.col(s) },
      { who: s.npc.ceo, role: "", key: "ceo", text: VOICES_NPC.ceo(s) }
    ];
    const ev = VOICES_EVENT.find(v => v.cond(s));
    const best = s.posts.slice().sort((a, b) => b.likes - a.likes)[0] || null;
    return {
      endingId: id, endingTitle: e.title, endingDesc: fill(s, e.desc),
      summary: `${s.brand.name}${josa(s.brand.name, "는")} '${e.title}'${josa(e.title, "로")} 기억됩니다.`,
      textureKey: tk, textureName: TEXTURES[tk],
      textureDesc: `당신은 ${AX_PHRASE[tk[0]]}, ${AX_PHRASE[tk[1]]}, ${AX_PHRASE[tk[2]]}, ${AX_PHRASE[tk[3]]}`,
      voices: npcVoices, eventVoice: ev, months: s.month, leaving: !!s.flags.leaving,
      followers: followers(s), bestPost: best,
      career: { from: TITLES[0], to: TITLES[s.title], salStart: s.money.start, salEnd: s.money.salary,
        earned: Math.round(s.money.earned + s.money.cash), cash: s.money.cash, acc: s.acc, bestMomentum: s.bestMomentum, draws: s.drawCount,
        prev: s.prevBrands, identity: s.identity,
        milestones: Object.keys(s.ms).map(id => MILESTONES.find(m => m.id === id).label()) }
    };
  }
};

/* 대표 컬러를 고르면 화면 색이 바뀐다 */
function mixHex(a, b, t) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const ch = sh => Math.round(((pa >> sh) & 255) * (1 - t) + ((pb >> sh) & 255) * t);
  return "#" + [16, 8, 0].map(sh => ch(sh).toString(16).padStart(2, "0")).join("");
}
function lum(hex) { const n = parseInt(hex.slice(1), 16); return (0.299 * (n >> 16 & 255) + 0.587 * (n >> 8 & 255) + 0.114 * (n & 255)) / 255; }
function applyTheme(s) {
  const root = document.documentElement.style;
  const props = ["--accent", "--accent-ink", "--bg", "--soft", "--line", "--brandfont"];
  if (!s || !s.identity) { props.forEach(p => root.removeProperty(p)); return; }
  const id = s.identity;
  if (id.color) {
    const dark = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches && document.documentElement.dataset.theme !== "light";
    const hex = id.color.hex, base = dark ? "#151513" : "#f5f3ee";
    const acc = dark ? mixHex(hex, "#ffffff", 0.35) : (lum(hex) > 0.62 ? mixHex(hex, "#000000", 0.18) : hex);
    root.setProperty("--accent", acc);
    root.setProperty("--accent-ink", lum(acc) > 0.6 ? "#1f1f1c" : "#ffffff");
    root.setProperty("--bg", mixHex(base, hex, dark ? 0.12 : 0.13));
    root.setProperty("--soft", mixHex(dark ? "#2a2926" : "#ebe7dd", hex, 0.2));
    root.setProperty("--line", mixHex(dark ? "#33322e" : "#e3dfd5", hex, 0.22));
  } else ["--accent", "--accent-ink", "--bg", "--soft", "--line"].forEach(p => root.removeProperty(p));
  if (id.font) root.setProperty("--brandfont", FONT_STACK[id.font]); else root.removeProperty("--brandfont");
}

function deltaChips(s, deltas) {

  const sg = d => d > 0 ? "+" : "";
  return `<div class="deltas">${ks.map(k => {
    const d = deltas[k];
    if (k === "promo") return `<span class="chip up">${esc(d)} 승진 ▲</span>`;
    if (k === "acc") return chip(`거래처 ${sg(d)}${d}곳`, d > 0);
    if (k === "identity") return `<span class="chip up">${esc(d)}</span>`;
    if (k === "switched") return `<span class="chip up">이직 · ${esc(d)}</span>`;

    if (k === "col" || k === "fan") return chip(`${s.npc[k]}${josa(s.npc[k], "와")}의 사이 ${sg(d)}${d}`, d > 0);

/* ---------- playing: 한 달 요약 (알림) ---------- */
function nextMonth() {
  const s = UI.s;
  const before = { ...s.stats }; const accBefore = s.acc;
  const r = Engine.advance(s);
  if (r.end) return finish();
  Track.ev("turn_reached", { month: s.month, chapter: chapterOf(s.month) });
  const done = s.month - 1;
  if (done >= 3 && done % 3 === 0 && UI.reportDone !== done) {
    UI.reportDone = done;
    return showReport(done, done % 12 === 0 ? "y" : "q", () => monthView(s, r, before));
  }
  monthView(s, r, before);
}
function monthView(s, r, before) {
  const begin = () => {
    Engine.start(s);
    if (r.reflect) showReflect(r.reflect, () => showEvent()); else showEvent();
  };
  if (s.month === 1 || UI.speed === 3) return begin();
  const drift = {}; STAT_KEYS.forEach(k => { const d = s.stats[k] - before[k]; if (d) drift[k] = d; });
  const chapterStart = [7, 19, 31].includes(s.month);
  const notis = [];
  notis.push(`이번 달 매출 <b>${fmtMan(revOf(s))}</b>${drift.sales ? ` (${drift.sales > 0 ? "▲" : "▼"} ${fmtMan(revOf(s, Math.abs(drift.sales)))})` : ""}`);
  if (s.momentum >= 2) notis.push(`<b>${s.momentum}개월 연속</b> 매출 상승 중`);
  notis.push(`월급 <b>${fmtMan(Math.round(s.money.salary / 12))}</b>이 들어왔습니다`);
  if (s.accLost) notis.push(`거래처 한 곳이 계약을 끝냈습니다 (신뢰 부족)`);
  if (s.bossGrumble) notis.push(`${esc(s.npc.ceo)}: "근데 왜 아직 아무도 우리를 몰라요?" (신임 −3)`);
  const fd = r.followerDelta;
  if (fd) notis.push(fd > 0 ? `새 팔로워 <b>${nf(fd)}</b>명` : `팔로워 <b>${nf(-fd)}</b>명이 떠났습니다`);
  if (r.luck >= 2) notis.push(`작은 유행이 ${esc(s.brand.name)} 쪽으로 불었습니다`);
  else if (r.luck <= -2) notis.push("시장이 조용한 달이었습니다");
  if (s.stats.budget <= 20) notis.push(`예산이 <b>${fmtMan(budOf(s))}</b>밖에 남지 않았습니다`);
  if (s.stats.energy <= 20) notis.push("요즘 잠을 잘 못 잡니다");
  const bannerHtml = banners(s);   // 한 번만 소비 (뽑기로 다시 그려도 유지)
  const fortuneBox = () => s.fortune
    ? `<div class="fortune"><p class="sub small" style="margin:0">오늘의 행운 뽑기</p><div class="tier t${FORTUNES.indexOf(s.fortune)}">${esc(s.fortune.tier)}</div><p class="small" style="margin:4px 0 0">${esc(s.fortune.line)}${s.fortune.bonus ? ` 이번 달 도전 성공률 ${s.fortune.bonus > 0 ? "+" : "−"}${Math.round(Math.abs(s.fortune.bonus) * 100)}%` : ""}</p></div>`
    : `<div class="fortune"><p class="sub small" style="margin:0 0 8px">출근길, 오늘의 행운 뽑기${s.drawStreak >= 2 ? ` · ${s.drawStreak}개월째 습관` : ""}</p><button class="btn ghost" data-key="2" id="draw" style="min-height:44px"><span class="k">2</span>한 장 뽑는다</button></div>`;
  const draw = () => {
    render(`${hud(s, drift, fd)}
      <div class="quiet" style="min-height:0;padding-top:6px">
        ${chapterStart ? `<p class="sub small" style="margin:0">${CHAPTERS[chapterOf(s.month)]}</p>` : ""}
        <h2 style="font-weight:500;margin:4px 0 0">${s.month}개월째</h2>
        ${bannerHtml}
        <ul class="noti">${notis.map(n => `<li>${avatar(s.brand.name, brandColor(s.brand.hue, 0), "sm")}<span>${n}</span></li>`).join("")}</ul>
        ${fortuneBox()}
      </div>
      <div class="grow"></div>
      <button class="btn primary" data-key="1" id="begin" style="margin-top:14px"><span class="k" style="color:inherit;opacity:.7">1</span>이번 달 시작</button>`, "playing");
    document.getElementById("begin").onclick = begin;

    bindFeed(draw);
    if (UI.auto) UI.timer = setTimeout(() => { if (!s.drew) { Engine.drawFortune(s); draw(); } else begin(); }, delay(1200) || 300);
  };
  draw();

/* ---------- 분기·연간 리포트 (그래프 + 인사이트) ---------- */
function fmtShort(n) { n = Math.round(n); return n >= 10000 ? (n / 10000).toFixed(n >= 100000 ? 0 : 1).replace(/\.0$/, "") + "억" : n.toLocaleString("ko-KR") + "만"; }
function niceMax(v) { if (v <= 0) return 10; const e = Math.pow(10, Math.floor(Math.log10(v))); const f = v / e; return ([1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10].find(x => f <= x)) * e; }
/* 한 지표 = 한 그래프 (두 축을 겹치지 않는다). 강조 구간, 이직 표시, 점마다 툴팁 */
function lineChart(rows, key, opt = {}) {
  if (rows.length < 2) return "";
  const W = 340, H = 150, L = 40, R = 14, T = 16, B = 22;
  const m0 = rows[0].m, m1 = rows[rows.length - 1].m;
  const max = niceMax(Math.max(...rows.map(r => r[key])) * 1.05);
  const x = m => L + (m1 === m0 ? 0 : (m - m0) / (m1 - m0)) * (W - L - R);
  const y = v => T + (1 - v / max) * (H - T - B);
  const grid = [0, max / 2, max].map(v => `<line class="gl" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L - 6}" y="${y(v) + 3}" text-anchor="end">${fmtShort(v)}</text>`).join("");
  const hl = opt.hl ? `<rect class="hl" x="${x(Math.max(m0, opt.hl[0])) - 4}" y="${T - 6}" width="${x(opt.hl[1]) - x(Math.max(m0, opt.hl[0])) + 8}" height="${H - T - B + 6}" rx="6"/>` : "";
  const sw = rows.filter((r, i) => i && r.brand !== rows[i - 1].brand).map(r => `<line class="sw" x1="${x(r.m) - 0.5 * (W - L - R) / Math.max(1, m1 - m0)}" x2="${x(r.m) - 0.5 * (W - L - R) / Math.max(1, m1 - m0)}" y1="${T - 4}" y2="${H - B}"/><text class="ax" x="${x(r.m) - 0.5 * (W - L - R) / Math.max(1, m1 - m0) + 3}" y="${T + 6}">이직</text>`).join("");
  let path = "", area = "";
  rows.forEach((r, i) => {

}

/* ---------- ending ---------- */
function showEnding() {
  const s = UI.s;
  const R = Engine.finalize(s);
  UI.result = R;
  const notes = Object.fromEntries(Object.entries(s.notes).filter(([k]) => k !== "__lastAsked"));
  if (!s.saved) { // 피드에서 돌아와 다시 그릴 때 중복 저장·측정 방지
    s.saved = true;
    const playSec = Math.round((Date.now() - s.startedAt) / 1000);
    Track.ev("ending", { ending_id: R.endingId, texture_id: R.textureKey, months: s.month, play_seconds: playSec, industry: s.brand.industry, posts: s.posts.length, followers: R.followers });
    const arc = Store.get("archive", []);
    arc.unshift({ seed: s.seed, name: s.brand.name, industry: s.brand.industryName, ending: R.endingTitle, endingId: R.endingId,
      texture: R.textureName, tk: R.textureKey, followers: R.followers, title: R.career.to, salary: R.career.salEnd, posts: s.posts.length, months: s.month, notes, at: Date.now() });
    Store.set("archive", arc.slice(0, 50));
    const dex = Store.get("dex", {}); dex[R.textureKey] = true; Store.set("dex", dex);
    const ends = Store.get("ends", {}); ends[R.endingId] = true; Store.set("ends", ends);
  }

  const tl = s.log.filter(l => l.key || l.order || l.jackpot || notes[l.m]).map(l =>
    `<li class="${l.jackpot ? "jp" : l.key ? "key" : ""}"><span class="m">${l.m}개월 · ${l.jackpot ? "대박 · " : ""}${esc(l.title)}${l.order ? " · 업무 순서 · 먼저 " + esc(l.order) : ""}</span>${esc(l.label)}${notes[l.m] ? `<span class="note">“${esc(notes[l.m])}”</span>` : ""}</li>`).join("");
  const lastNote = notes[36] ? `<li class="key"><span class="m">36개월 · 마지막 한마디</span><span class="note">“${esc(notes[36])}”</span></li>` : "";
  const extra = s.end === "closed" ? `<p class="sub small">${s.month}개월째에 예산이 바닥났습니다.</p>` :
    s.end === "left" ? `<p class="sub small">${s.month}개월째, 두 번째로 몸이 멈췄습니다.</p>` :
    s.end === "replaced" ? `<p class="sub small">${s.month}개월째, ${esc(s.npc.ceo)}${josa(s.npc.ceo, "와")}의 관계가 끝났습니다.</p>` :
    R.leaving ? `<p class="sub small">그리고 당신은 다음 달, 다른 회사로 떠났습니다.</p>` : "";
  const posts = s.posts.slice().reverse();
  render(`
    <div style="padding-top:16px" class="stack">
      <p class="sub small">${esc(s.brand.industryName)} · ${esc(s.brand.sizeName)} · ${s.month}개월 · 거래처 ${s.acc}곳 · 팔로워 ${nf(R.followers)}</p>
      <h1>${esc(R.summary)}</h1>
      <p>${esc(R.endingDesc)}</p>${extra}
    </div>
    ${R.career.identity && R.career.identity.color ? `<div class="card" style="margin-top:16px">
      <p class="sub small" style="margin:0 0 10px">${esc(s.brand.name)}의 아이덴티티</p>
      <div class="idcard"><span class="swatch" style="background:${esc(R.career.identity.color.hex)}"></span>
        <div><div class="bn brandname">${esc(s.brand.name)}</div>
        <p class="sub small" style="margin:2px 0 0">${esc(R.career.identity.color.name)}${R.career.identity.font ? " · " + FONT_NAME[R.career.identity.font] : ""}${R.career.identity.voice ? " · " + esc(R.career.identity.voice) : ""}</p>
        ${R.career.identity.slogan ? `<p style="margin:4px 0 0" class="brandname">“${esc(R.career.identity.slogan)}”</p>` : ""}</div></div>
    </div>` : ""}
    <div class="card stack" style="margin-top:16px">
      <p class="sub small">마케터의 결</p>
      <div class="texture"><b>${esc(R.textureName)}</b><p class="sub small" style="margin:4px 0 0">${esc(R.textureDesc)}</p></div>
      <p class="sub small" style="margin-top:8px">결은 점수가 아니에요. 3년 동안 당신이 기운 방향입니다.</p>
    </div>
    <div class="card stack" style="margin-top:12px">
      <p class="sub small">남은 말</p>
      ${R.voices.map(v => `<div class="voice">${avatar(v.who, npcColor(v.key), "sm")}<p style="margin:0"><span>${esc(v.who)}${v.role ? " · " + v.role : ""}</span>“${esc(v.text)}”</p></div>`).join("")}
      ${R.eventVoice ? `<div class="voice">${avatar(R.eventVoice.who, "#8a8579", "sm")}<p style="margin:0"><span>${esc(R.eventVoice.who)}</span>“${esc(R.eventVoice.text)}”</p></div>` : ""}
    </div>
    <div class="card" style="margin-top:12px">
      <p class="sub small" style="margin:0">나의 3년 (금액은 가상)</p>
      <div class="career">
        ${R.career.prev.length ? `<div style="grid-column:1/-1">커리어 경로<b>${R.career.prev.map(p => `${esc(p.name)} (${esc(p.industryName)} · ${p.months}개월)`).join(" → ")} → ${esc(s.brand.name)} (${esc(s.brand.industryName)} · ${s.month - s.brandStart}개월)</b></div>` : ""}
        <div>직급<b>${esc(R.career.from)} → ${esc(R.career.to)}</b></div>
        <div>연봉<b>${fmtMan(R.career.salStart)} → ${fmtMan(R.career.salEnd)}</b></div>
        <div>연봉 상승<b>+${fmtMan(R.career.salEnd - R.career.salStart)}</b></div>
        <div>3년간 번 돈<b>${fmtMan(R.career.earned)}</b></div>
        <div>마지막 월 매출<b>${fmtMan(revOf(s))}</b></div>
        <div>거래처<b>${R.career.acc}곳</b></div>
        <div>최장 상승세<b>${R.career.bestMomentum}개월</b></div>
        <div>남은 예산<b>${fmtMan(budOf(s))}</b></div>
      </div>
      ${R.career.milestones.length ? `<p class="small" style="margin:10px 0 0"><span class="sub">마일스톤</span><br>${R.career.milestones.map(esc).join(" · ")}</p>` : ""}
    </div>
    <div class="statgrid" style="margin-top:12px">
      ${STAT_KEYS.filter(k => k !== "budget").map(k => `<div><b>${s.stats[k]}</b>${STAT_NAMES[k]}</div>`).join("")}
    </div>
    <div class="card" style="margin-top:12px;padding:14px">
      <p class="sub small" style="margin:0">3년의 숫자</p>
      ${[1, 2, 3].filter(y => s.hist.some(h => h.m > (y - 1) * 12)).length > 1 ? `<p class="small" style="margin:6px 0 0">${[1, 2, 3].map(y => { const rr = s.hist.filter(h => h.m > (y - 1) * 12 && h.m <= y * 12); return rr.length ? `${y}년차 ${esc(fmtMan(sumRev(rr)))}` : ""; }).filter(Boolean).join(" → ")}</p>` : ""}
      ${lineChart(s.hist, "rev", { title: "월 매출" })}
      ${lineChart(s.hist, "bud", { title: "마케팅 예산 잔액" })}
      <ul class="insight">${insightsFor(s, Math.max(1, s.month - 11), s.month).map(t => `<li>${esc(t)}</li>`).join("")}</ul>
      ${dataTable(s.hist)}
    </div>
    ${posts.length ? `<div style="margin-top:20px"><p class="sub small" style="margin:0">3년의 피드 · 게시물 ${posts.length}개</p>
      <div class="grid">${posts.map(p => `<button class="tile" data-p="${p.id}" style="background:${postBg(s, p)}" aria-label="${p.m}개월 게시물: ${esc(p.h)}">${esc(p.h)}</button>`).join("")}</div>
      ${R.bestPost ? `<p class="sub small" style="margin:14px 0 0">가장 사랑받은 게시물</p>${postCard(s, R.bestPost)}` : ""}</div>` : ""}
    <div style="margin-top:20px">
      <p class="sub small">36개월의 갈림길</p>
      <ul class="tl">${tl}${lastNote}</ul>
    </div>
    <div class="stack" style="margin-top:18px">
      <button class="btn primary" data-key="1" id="again">새 브랜드 맡기</button>
      <div class="row">
        <button class="btn ghost" data-key="2" id="copy">결과 복사</button>
        <button class="btn ghost" data-key="3" id="card">카드 저장</button>
      </div>
      <div class="row">
        <button class="btn ghost" data-key="4" id="arc">보관함</button>
        <button class="btn ghost" id="replay">같은 시드로 다시</button>
      </div>
      <p class="seed center">시드 ${s.seed}</p>
    </div>`, "ending");
  $app.querySelectorAll("[data-p]").forEach(b => b.onclick = () => { UI.back = showEnding; showFeed(+b.dataset.p); });
  document.getElementById("again").onclick = () => { Track.ev("restart", { prev_ending: R.endingId }); UI.seedText = ""; showTitle(); };
  document.getElementById("replay").onclick = () => { Track.ev("restart", { prev_ending: R.endingId, same_seed: true }); UI.redraws = 0; startGame(s.seed); };
  document.getElementById("copy").onclick = () => { Track.ev("share_click", { ending_id: R.endingId, method: "copy" }); copyText(shareText(s, R)); };
  document.getElementById("card").onclick = () => { Track.ev("card_download", { ending_id: R.endingId }); downloadCard(s, R); };
  document.getElementById("arc").onclick = showArchive;
}

function shareUrl(R) {
  try {
    const u = new URL(location.href); u.search = ""; u.hash = "";
    u.searchParams.set("utm_source", "share"); u.searchParams.set("utm_medium", "game"); u.searchParams.set("utm_campaign", "result");
    u.searchParams.set("utm_content", R.endingId);
    return u.protocol.startsWith("http") ? u.toString() : "";
  } catch (e) { return ""; }
}
function shareText(s, R) {
  const url = shareUrl(R);
  return `[한 브랜드의 일생]\n${R.career.prev.length ? R.career.prev.map(p => p.name).join(" → ") + " → " + s.brand.name + "\n" : ""}${R.summary}\n마케터의 결: ${R.textureName}\n팔로워 ${nf(R.followers)} · 게시물 ${s.posts.length}개\n` +
    `${R.career.from} → ${R.career.to} · 연봉 ${fmtMan(R.career.salStart)} → ${fmtMan(R.career.salEnd)} · 거래처 ${R.career.acc}곳\n` +
    STAT_KEYS.filter(k => k !== "budget").map(k => `${STAT_NAMES[k]} ${s.stats[k]}`).join(" · ") + `\n시드 ${s.seed}` + (url ? `\n${url}` : "");
}
function copyText(t) {
  const ok = () => toast("결과를 복사했어요");
  try { if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(t).then(ok, () => fallbackCopy(t, ok)); } catch (e) {}
  fallbackCopy(t, ok);
}
function fallbackCopy(t, ok) {
  const ta = document.createElement("textarea"); ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); ok(); } catch (e) { toast("복사가 막혀 있어요"); }
  ta.remove();
}

/* ---------- 공유 카드 (canvas) ---------- */
function downloadCard(s, R) {
  const W = 1080, H = 1350, c = document.createElement("canvas"); c.width = W; c.height = H;
  const g = c.getContext("2d");
  const F = '-apple-system,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif';
  g.fillStyle = "#f5f3ee"; g.fillRect(0, 0, W, H);
  g.fillStyle = "#fffdf9"; roundRect(g, 60, 60, W - 120, H - 120, 40); g.fill();
  g.strokeStyle = "#e3dfd5"; g.lineWidth = 2; g.stroke();
  g.fillStyle = `hsl(${s.brand.hue} 38% 48%)`; g.beginPath(); g.arc(170, 175, 50, 0, Math.PI * 2); g.fill();
  g.fillStyle = "#fff"; g.font = `700 46px ${F}`; g.textAlign = "center"; g.fillText(s.brand.name.slice(0, 1), 170, 192); g.textAlign = "left";
  g.fillStyle = "#1f1f1c"; g.font = `700 64px ${F}`; g.fillText(s.brand.name, 245, 172);
  g.fillStyle = "#6b6860"; g.font = `400 30px ${F}`; g.fillText(`팔로워 ${nf(R.followers)} · 게시물 ${s.posts.length} · ${s.month}개월`, 245, 220);
  // 피드 썸네일 3x2
  const ps = s.posts.slice(-6).reverse();
  ps.forEach((p, i) => {
    const x = 130 + (i % 3) * 278, y = 270 + Math.floor(i / 3) * 278, sz = 268;
    const shift = { photo: 0, event: 1, test: 2, ad: 3, notice: 4, collab: 5, repost: 6, sale: 7 }[p.k] || 0;
    const gr = g.createLinearGradient(x, y, x + sz, y + sz);
    gr.addColorStop(0, `hsl(${(s.brand.hue + shift * 24) % 360} 42% 52%)`); gr.addColorStop(1, `hsl(${(s.brand.hue + shift * 24 + 30) % 360} 40% 36%)`);
    g.fillStyle = gr; roundRect(g, x, y, sz, sz, 12); g.fill();
    g.fillStyle = "#fff"; g.font = `700 26px ${F}`; wrap(g, p.h, x + 18, y + sz - 60, sz - 36, 32, 2);
  });
  const baseY = ps.length > 3 ? 860 : ps.length ? 582 : 300;
  g.fillStyle = "#1f1f1c"; g.font = `700 50px ${F}`; let y = wrap(g, `'${R.endingTitle}'`, 130, baseY + 40, W - 260, 64);
  g.fillStyle = "#3f5b4f"; g.fillRect(130, y + 40, 6, 96);
  g.fillStyle = "#6b6860"; g.font = `400 28px ${F}`; g.fillText("마케터의 결", 160, y + 76);
  g.fillStyle = "#1f1f1c"; g.font = `700 40px ${F}`; g.fillText(R.textureName, 160, y + 126);
  g.fillStyle = "#1f1f1c"; g.font = `600 30px ${F}`; g.fillText(`${R.career.from} → ${R.career.to} · 연봉 ${fmtMan(R.career.salStart)} → ${fmtMan(R.career.salEnd)}`, 130, Math.min(H - 170, y + 200));
  g.fillStyle = "#6b6860"; g.font = `400 26px ${F}`; g.fillText(`한 브랜드의 일생 · 시드 ${s.seed}`, 130, H - 110);
  const filename = `brand-life-${s.brand.name}.png`;
  try {
    c.toBlob(async b => {
      if (!b) return toast("카드를 만들지 못했어요");
      if (UI.downloads) {
        try { await UI.downloads.save({ filename, data: b }); toast("카드를 저장했어요"); }
        catch (e) { toast(e && e.code === "declined" ? "저장을 취소했어요" : "이 환경에선 저장이 막혀 있어요"); }
        return;
      }
      const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = filename;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      toast("카드를 저장했어요");
    }, "image/png");
  } catch (e) { toast("이 환경에선 저장이 막혀 있어요"); }
}
function roundRect(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function wrap(g, text, x, y, maxW, lh, maxLines = 9) {
  let line = "", n = 1;
  for (const ch of text) {
    if (g.measureText(line + ch).width > maxW && line) {
      if (n >= maxLines) { line = line.slice(0, -1) + "…"; break; }
      g.fillText(line, x, y); line = ch; y += lh; n++;
    } else line += ch;
  }
  if (line) g.fillText(line, x, y);
  return y;
}

/* ---------- archive ---------- */
function showArchive() {
  Track.ev("archive_open", {});
  const arc = Store.get("archive", []);
  const dex = Store.get("dex", {});
  const ends = Store.get("ends", {});
  const list = arc.length ? arc.map(a => `<li class="key"><span class="m">${new Date(a.at).toLocaleDateString("ko-KR")} · ${esc(a.industry)} · 팔로워 ${nf(a.followers || 0)}${a.salary ? ` · ${esc(a.title)} · 연봉 ${fmtMan(a.salary)}` : ""} · 시드 ${a.seed}</span>
      <b>${esc(a.name)}</b> — ${esc(a.ending)}<span class="note">${esc(a.texture)}</span>
      ${Object.entries(a.notes || {}).map(([m, n]) => `<span class="note">${m}개월: “${esc(n)}”</span>`).join("")}</li>`).join("")
    : `<p class="sub">아직 맡았던 브랜드가 없어요.</p>`;
  const dexHtml = Object.entries(TEXTURES).map(([k, n]) => `<div class="${dex[k] ? "on" : ""}">${dex[k] ? esc(n) : "아직 만나지 못한 결"}</div>`).join("");
  render(`
    <div style="padding-top:16px"><h2>브랜드 보관함</h2>
      <p class="sub small">이 기기에만 저장돼요. 만난 결 ${Object.keys(dex).length}/16 · 본 엔딩 ${Object.keys(ends).length}/9</p></div>
    <ul class="tl" style="margin-top:10px">${list}</ul>
    <h2 style="margin-top:22px">결 도감</h2>
    <div class="dex">${dexHtml}</div>
    <div class="stack" style="margin-top:20px"><button class="btn primary" data-key="1" id="back">처음으로</button></div>`, "archive");
  document.getElementById("back").onclick = showTitle;
}

/* ---------- about ---------- */
function showAbout() {
  render(`
    <div style="padding-top:28px" class="stack">
      <h2>만든 사람</h2>
      <p>${esc(CONFIG.CREATOR.name)}</p>
      ${CONFIG.CREATOR.link ? `<p><a href="${esc(CONFIG.CREATOR.link)}" target="_blank" rel="noopener">포트폴리오 보기</a></p>` : ""}
      <p class="sub small">이 게임의 브랜드, 사람, 숫자는 모두 지어낸 것입니다. 실존 브랜드와 관계가 없습니다. 연봉·매출·예산·광고 지표 등 숫자는 이해를 돕기 위한 가상의 근사치이며 실제 시장 데이터가 아닙니다. 패러디 브랜드 이름은 웃음을 위한 가상의 이름으로, 실제 브랜드·기업과 관계가 없고 게임 속 사건은 실제와 무관합니다.</p>
      <p class="sub small">영감을 준 게임: 이번 생은 야구다, 80억 분의 1</p>
    </div>
    <div class="grow"></div>
    <button class="btn primary" data-key="1" id="back" style="margin-top:20px">돌아가기</button>`, "about");
  document.getElementById("back").onclick = showTitle;
}

/* ---------- 키보드 1~4 ---------- */
document.addEventListener("keydown", e => {
  if (e.target && /^(TEXTAREA|INPUT|SELECT)$/.test(e.target.tagName)) return;
  if (/^[1-4]$/.test(e.key)) {
    const b = $app.querySelector(`[data-key="${e.key}"]`);
    if (b && !b.disabled) { e.preventDefault(); b.click(); }
  }
});

Track.init();
showTitle();
try { if (window.claude && window.claude.use) window.claude.use("downloads").then(d => { UI.downloads = d || null; }, () => {}); } catch (e) {}
</script>
